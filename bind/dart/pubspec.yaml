name: eden_press
description: >-
  JS-free Dart/Flutter rendering surface for Eden Press (DART-04). Binds the
  07-01 C ABI (PressRender/PressFree) via dart:ffi on Android/iOS, calls the
  07-02 wasm-registered pressRender JS global via dart:js_interop on Web, and
  renders press.Output.Model's schema-v2 blocks natively -- math via
  flutter_math_fork, code via flutter_highlighting. No JavaScript, no
  HTML/DOM parsing, anywhere in the render path.
version: 0.1.0
homepage: https://github.com/AO-Cyber-Systems/eden-press

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: 2.1.4
  web: 1.1.1
  flutter_math_fork: 0.7.4
  highlighting: 0.9.0+11.8.0
  flutter_highlighting: 0.9.0+11.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: structurally parses THIS file's dependencies: block in
  # render_surface_test.dart (Test-list case 4) to lock the JS-free/no-scrape
  # contract. Never imported by the render path itself.
  yaml: 3.1.3

# This identifies the package as a Flutter plugin_ffi package -- the template
# Flutter itself carves out specifically for native code that must be
# STATICALLY linked on iOS (DynamicLibrary.process(), not .open()); see
# 07-RESEARCH.md Sec 4 and lib/src/native_loader.dart.
#
# The android/ios native scaffolding that vendors 07-03's build-android.sh /
# build-ios.sh artifacts (android/src/main/jniLibs/<abi>/libpress.so, an iOS
# podspec `vendored_libraries` entry for EdenPress.xcframework) is the
# follow-up integration step: it is out of this TRD's file scope (pubspec.yaml
# + lib/ + test/ only -- see 07-05-TRD.md files_modified / SUMMARY Deviations
# for the explicit scoping note). Declaring `ffiPlugin: true` for both
# platforms here is the correct, forward-compatible plugin registration
# regardless of when that native vendoring lands; flutter pub get / dart
# analyze do not require the native directories to exist to validate cleanly
# (verified empirically against a throwaway scaffold before writing this).
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
