name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build / vet / test / license-header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install addlicense
        run: go install github.com/google/addlicense@latest

      - name: Check license headers
        # conformance/corpus/cases/** is Marp-derived golden data (rendered through
        # @marp-team/marp-core), NOT Eden Press source — it must NOT carry our
        # copyright header; its provenance is recorded in NOTICE. node_modules is
        # dev-only tooling deps. Everything else must have the MIT header.
        run: addlicense -l mit -s -c "AO Cyber Systems" -ignore 'conformance/corpus/cases/**' -ignore '**/node_modules/**' -check .
