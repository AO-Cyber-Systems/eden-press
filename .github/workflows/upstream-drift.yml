name: Check Marp upstream drift

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: compare pinned vs latest
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        repo: [marp-team/marpit, marp-team/marp-core, marp-team/marp-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned vs latest release
        run: |
          set -euo pipefail
          LATEST=$(gh release view --repo "${{ matrix.repo }}" --json tagName --jq '.tagName')
          PINNED=$(grep "${{ matrix.repo }}" UPSTREAM-VERSIONS.txt | grep -v '^#' | cut -d' ' -f2)
          echo "repo=${{ matrix.repo }} pinned=$PINNED latest=$LATEST"
          if [ "$LATEST" != "$PINNED" ]; then
            TITLE="Upstream drift: ${{ matrix.repo }} released $LATEST (pinned: $PINNED)"
            EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[].number')
            if [ -z "$EXISTING" ]; then
              gh issue create --title "$TITLE" --label upstream-drift \
                --body "Conformance corpus / attribution was mined from ${{ matrix.repo }} @ \`$PINNED\`. Latest release is \`$LATEST\`. Review for spec/theme changes and update UPSTREAM-VERSIONS.txt (and NOTICE, if a vendored asset changed) accordingly."
            else
              echo "Deduplicated: issue already open (#$EXISTING) for $TITLE"
            fi
          else
            echo "No drift for ${{ matrix.repo }}."
          fi
