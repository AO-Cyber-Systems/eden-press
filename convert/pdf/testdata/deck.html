<!--
 - deck.html is a hand-built (no_llm_test_data), press/-decoupled body
 - fragment: three <section> slides, mirroring the shape press.Output.HTML
 - carries (a body fragment, NOT a full document -- pdf.go's
 - composeDocument wraps it in <html><head><style>...). The middle slide
 - carries class="bg" so pdf_test.go's WithPrintBackground case can prove
 - the background-color it names actually gets rendered into the PDF.
 -->
<section>
<h1>Welcome</h1>
<p>A hand-built multi-slide fixture for convert/pdf's structural tests.</p>
</section>
<section class="bg">
<h1>Background Slide</h1>
<p>This slide carries a solid background-color via the .bg class in deck.css.</p>
</section>
<section>
<h1>Closing</h1>
<p>Three slides total -- the structural page-count baseline every ToPDF test in this package pins against.</p>
</section>
